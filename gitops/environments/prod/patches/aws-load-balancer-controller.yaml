apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aws-load-balancer-controller
  namespace: argocd
spec:
  source:
    helm:
      valuesObject:
        clusterName: harbor-goods-prod
        region: us-east-1
        # Pods cannot reach IMDS (hop limit 1), so the controller finds its VPC by tag.
        vpcTags:
          Name: harbor-goods-prod
