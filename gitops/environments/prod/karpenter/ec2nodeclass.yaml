apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: default
spec:
  # Created by infra/terraform/modules/karpenter; the name is checked by the prod Terraform test.
  role: harbor-goods-prod-karpenter-node
  # Pinned AMI release. Prod runs the AMI release dev has already run on; bump it after dev.
  amiSelectorTerms:
    - alias: al2023@v20260917
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: harbor-goods-prod
  # Nodes sit in private subnets and never get a public IP address.
  associatePublicIPAddress: false
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: harbor-goods-prod
  # Same IMDS posture as the managed node group: IMDSv2 only, unreachable from pods.
  metadataOptions:
    httpEndpoint: enabled
    httpProtocolIPv6: disabled
    httpTokens: required
    httpPutResponseHopLimit: 1
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 50Gi
        volumeType: gp3
        encrypted: true
        deleteOnTermination: true
  tags:
    Project: harbor-goods-eks
    Environment: prod
    ManagedBy: karpenter
