apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: default
spec:
  # Created by infra/terraform/modules/karpenter; the name is checked by the dev Terraform test.
  role: harbor-goods-dev-karpenter-node
  # Pinned AMI release. Dev takes a new AMI release first; prod follows once dev has run on it.
  amiSelectorTerms:
    - alias: al2023@v20260923
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: harbor-goods-dev
  # Nodes sit in private subnets and never get a public IP address.
  associatePublicIPAddress: false
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: harbor-goods-dev
  # Same IMDS posture as the managed node group: IMDSv2 only, unreachable from pods.
  metadataOptions:
    httpEndpoint: enabled
    httpProtocolIPv6: disabled
    httpTokens: required
    httpPutResponseHopLimit: 1
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 50Gi
        volumeType: gp3
        encrypted: true
        deleteOnTermination: true
  tags:
    Project: harbor-goods-eks
    Environment: dev
    ManagedBy: karpenter
