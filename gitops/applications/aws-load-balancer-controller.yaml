# Keep the chart version in step with the vendored IAM policy in
# infra/terraform/modules/eks/policies/aws-load-balancer-controller-v3.5.0.json.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aws-load-balancer-controller
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  source:
    repoURL: https://aws.github.io/eks-charts
    chart: aws-load-balancer-controller
    targetRevision: 3.5.0
    helm:
      releaseName: aws-load-balancer-controller
      # Environment patches add clusterName and vpcTags.
      valuesObject:
        replicaCount: 2
        serviceAccount:
          create: true
          name: aws-load-balancer-controller
        nodeSelector:
          harbor-goods.example.com/pool: system
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
