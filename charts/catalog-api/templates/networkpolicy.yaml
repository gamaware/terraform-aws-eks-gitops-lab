{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "catalog-api.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "catalog-api.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "catalog-api.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # The ALB reaches pod IPs directly from its own ENIs, so the source is not a pod selector.
    - ports:
        - protocol: TCP
          port: {{ .Values.containerPort }}
  egress:
    # DNS only: the stand-in image serves static content and calls nothing else.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
{{- end }}
