{{- if .Values.podDisruptionBudget.enabled }}
{{- $minReplicas := ternary .Values.autoscaling.minReplicas .Values.replicaCount .Values.autoscaling.enabled | int }}
{{- if le $minReplicas (.Values.podDisruptionBudget.minAvailable | int) }}
{{- fail "podDisruptionBudget.minAvailable must be below the minimum replica count, or node drains block forever" }}
{{- end }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "storefront.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "storefront.labels" . | nindent 4 }}
spec:
  # Karpenter consolidation and node upgrades respect this, so they never drain every replica.
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "storefront.selectorLabels" . | nindent 6 }}
{{- end }}
