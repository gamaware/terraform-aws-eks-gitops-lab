version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions-all:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: ci

  - package-ecosystem: terraform
    directories:
      - /infra/terraform/envs/dev
      - /infra/terraform/envs/prod
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      terraform-all:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: chore

  - package-ecosystem: pip
    directory: /tests
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      pip-all:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: chore
